<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-grn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arr-gry" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="880" height="750" fill="#fafafa"/>

  <!-- ============================================================ -->
  <!-- ROW 1: Consumers (top)                                       -->
  <!-- ============================================================ -->
  <text x="440" y="28" text-anchor="middle" fill="#888" font-size="11" font-weight="bold" letter-spacing="2">CONSUMERS</text>

  <rect x="170" y="40" width="280" height="42" rx="6" fill="#424242" stroke="#212121" stroke-width="1.5"/>
  <text x="310" y="66" text-anchor="middle" fill="white" font-size="13" font-weight="bold">OpenShift Console</text>

  <rect x="490" y="40" width="200" height="42" rx="6" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>
  <text x="590" y="66" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Grafana</text>

  <!-- ============================================================ -->
  <!-- ROW 2: Thanos Querier + Alertmanager                         -->
  <!-- ============================================================ -->
  <text x="440" y="118" text-anchor="middle" fill="#888" font-size="11" font-weight="bold" letter-spacing="2">QUERY &amp; NOTIFICATION</text>

  <rect x="220" y="132" width="220" height="42" rx="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="330" y="158" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Thanos Querier</text>

  <rect x="490" y="132" width="200" height="42" rx="6" fill="#c62828" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="590" y="158" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Alertmanager</text>

  <!-- Querier → Console -->
  <line x1="310" y1="132" x2="310" y2="82" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>
  <!-- Querier → Grafana -->
  <line x1="440" y1="145" x2="490" y2="68" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>

  <!-- ============================================================ -->
  <!-- ROW 3: Two Prometheus instances + Thanos Ruler                -->
  <!-- ============================================================ -->
  <text x="440" y="210" text-anchor="middle" fill="#888" font-size="11" font-weight="bold" letter-spacing="2">METRICS STORAGE &amp; RULE EVALUATION</text>

  <!-- Platform Prometheus box -->
  <rect x="40" y="228" width="270" height="130" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="175" y="248" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold">Platform monitoring</text>
  <text x="175" y="262" text-anchor="middle" fill="#1565c0" font-size="9" font-style="italic">openshift-monitoring</text>

  <rect x="65" y="275" width="220" height="34" rx="5" fill="#1565c0" stroke="#0d47a1" stroke-width="1"/>
  <text x="175" y="297" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Prometheus</text>

  <rect x="65" y="318" width="220" height="28" rx="4" fill="#bbdefb" stroke="#64b5f6" stroke-width="1"/>
  <text x="175" y="337" text-anchor="middle" fill="#0d47a1" font-size="10">PrometheusRule: gpu-health-alerts</text>

  <!-- UWM Prometheus box -->
  <rect x="340" y="228" width="270" height="130" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="475" y="248" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">User workload monitoring</text>
  <text x="475" y="262" text-anchor="middle" fill="#2e7d32" font-size="9" font-style="italic">openshift-user-workload-monitoring</text>

  <rect x="365" y="275" width="220" height="34" rx="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
  <text x="475" y="297" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Prometheus (UWM)</text>

  <!-- Thanos Ruler box -->
  <rect x="640" y="228" width="200" height="130" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="740" y="248" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">Thanos Ruler</text>
  <text x="740" y="262" text-anchor="middle" fill="#2e7d32" font-size="9" font-style="italic">openshift-user-workload-monitoring</text>

  <rect x="660" y="275" width="160" height="34" rx="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
  <text x="740" y="297" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Rule evaluator</text>

  <rect x="660" y="318" width="160" height="28" rx="4" fill="#c8e6c9" stroke="#81c784" stroke-width="1"/>
  <text x="740" y="337" text-anchor="middle" fill="#1b5e20" font-size="10">PrometheusRule:</text>
  <text x="740" y="337" text-anchor="middle" fill="#1b5e20" font-size="10" dy="-12">inference-slo-alerts</text>

  <!-- Platform Prometheus → Thanos Querier -->
  <line x1="175" y1="275" x2="270" y2="174" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>
  <!-- UWM Prometheus → Thanos Querier -->
  <line x1="475" y1="275" x2="390" y2="174" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>

  <!-- Platform Prometheus → Alertmanager (firing) -->
  <line x1="285" y1="290" x2="490" y2="160" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="380" y="218" width="82" height="18" rx="3" fill="white" stroke="#c62828" stroke-width="0.5"/>
  <text x="421" y="232" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">GPU alerts</text>

  <!-- Thanos Ruler → UWM Prometheus (queries to evaluate rules) -->
  <line x1="660" y1="292" x2="585" y2="292" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>
  <text x="622" y="286" text-anchor="middle" fill="#666" font-size="8">queries</text>

  <!-- Thanos Ruler → Alertmanager (firing) -->
  <line x1="740" y1="228" x2="640" y2="174" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="748" y="186" width="86" height="18" rx="3" fill="white" stroke="#c62828" stroke-width="0.5"/>
  <text x="791" y="200" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">vLLM alerts</text>

  <!-- ============================================================ -->
  <!-- ROW 4: Data sources (bottom)                                  -->
  <!-- ============================================================ -->
  <text x="440" y="395" text-anchor="middle" fill="#888" font-size="11" font-weight="bold" letter-spacing="2">DATA SOURCES</text>

  <!-- GPU node -->
  <rect x="40" y="410" width="270" height="140" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="175" y="430" text-anchor="middle" fill="#2e7d32" font-size="11" font-weight="bold">GPU node</text>
  <text x="175" y="444" text-anchor="middle" fill="#2e7d32" font-size="9" font-style="italic">nvidia-gpu-operator</text>

  <rect x="65" y="458" width="220" height="50" rx="5" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
  <text x="175" y="480" text-anchor="middle" fill="white" font-size="12" font-weight="bold">NVIDIA DCGM Exporter</text>
  <text x="175" y="498" text-anchor="middle" fill="#c8e6c9" font-size="9">Utilization, temperature, memory, power</text>

  <rect x="95" y="518" width="160" height="24" rx="4" fill="#c8e6c9" stroke="#81c784" stroke-width="1"/>
  <text x="175" y="535" text-anchor="middle" fill="#1b5e20" font-size="9">ServiceMonitor (platform)</text>

  <!-- User project -->
  <rect x="370" y="410" width="470" height="140" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="605" y="430" text-anchor="middle" fill="#e65100" font-size="11" font-weight="bold">User project</text>
  <text x="605" y="444" text-anchor="middle" fill="#e65100" font-size="9" font-style="italic">my-model-namespace (e.g. llm-serving)</text>

  <!-- Model pod -->
  <rect x="395" y="458" width="240" height="50" rx="5" fill="#e65100" stroke="#bf360c" stroke-width="1"/>
  <text x="515" y="478" text-anchor="middle" fill="white" font-size="12" font-weight="bold">vLLM runtime</text>
  <text x="515" y="498" text-anchor="middle" fill="#ffe0b2" font-size="9">TTFT, queue depth, KV cache, tokens/sec</text>

  <!-- ServiceMonitor -->
  <rect x="665" y="468" width="150" height="30" rx="4" fill="#ff9800" stroke="#e65100" stroke-width="1"/>
  <text x="740" y="488" text-anchor="middle" fill="white" font-size="10" font-weight="bold">ServiceMonitor</text>

  <text x="740" y="515" text-anchor="middle" fill="#e65100" font-size="9" font-style="italic">(auto-created by KServe)</text>

  <!-- vLLM → ServiceMonitor -->
  <line x1="635" y1="483" x2="665" y2="483" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-grn)"/>

  <!-- ServiceMonitor → UWM Prometheus -->
  <line x1="740" y1="468" x2="520" y2="309" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="650" y="380" text-anchor="middle" fill="#2e7d32" font-size="9" font-weight="bold">scrape</text>

  <!-- DCGM → Platform Prometheus -->
  <line x1="175" y1="458" x2="175" y2="346" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="190" y="400" fill="#2e7d32" font-size="9" font-weight="bold">scrape</text>

  <!-- ============================================================ -->
  <!-- LEGEND                                                        -->
  <!-- ============================================================ -->
  <rect x="40" y="580" width="800" height="155" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>

  <text x="60" y="602" fill="#333" font-size="12" font-weight="bold">Legend</text>

  <line x1="60" y1="622" x2="100" y2="622" stroke="#2e7d32" stroke-width="2" marker-end="url(#arr-grn)"/>
  <text x="112" y="626" fill="#333" font-size="11">Metrics scrape</text>

  <line x1="260" y1="622" x2="300" y2="622" stroke="#666" stroke-width="1.5" marker-end="url(#arr-gry)"/>
  <text x="312" y="626" fill="#333" font-size="11">Data query</text>

  <line x1="460" y1="622" x2="500" y2="622" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="512" y="626" fill="#333" font-size="11">Firing alerts</text>

  <text x="60" y="652" fill="#333" font-size="11" font-weight="bold">How it works:</text>
  <text x="60" y="670" fill="#555" font-size="10">1. DCGM Exporter and vLLM each expose /metrics. Prometheus scrapes them via ServiceMonitors.</text>
  <text x="60" y="686" fill="#555" font-size="10">2. Platform Prometheus stores GPU metrics; UWM Prometheus stores vLLM metrics. Thanos Querier queries both.</text>
  <text x="60" y="702" fill="#555" font-size="10">3. Platform Prometheus evaluates GPU alert rules directly. Thanos Ruler evaluates vLLM alert rules by querying UWM Prometheus.</text>
  <text x="60" y="718" fill="#555" font-size="10">4. Both send firing alerts to the shared Alertmanager, which routes notifications to Slack, PagerDuty, etc.</text>

  <!-- Title -->
  <text x="440" y="748" text-anchor="middle" fill="#555" font-size="11" font-style="italic">Figure 1. OpenShift monitoring stack architecture for AI model serving</text>
</svg>