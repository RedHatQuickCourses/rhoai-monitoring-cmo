<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Red Hat Text, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="400" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#151515">LLM Inference Pipeline: Prefill and Decode Phases</text>

  <!-- Request arrives -->
  <rect x="30" y="60" width="120" height="50" rx="6" fill="#E7F1FA" stroke="#0066CC" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#002952">User Request</text>
  <text x="90" y="96" text-anchor="middle" font-size="9" fill="#6A6E73">"Explain K8s..."</text>

  <!-- Arrow to queue -->
  <line x1="152" y1="85" x2="178" y2="85" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Request Queue -->
  <rect x="180" y="55" width="130" height="60" rx="6" fill="#FAECD5" stroke="#F4C145" stroke-width="1.5"/>
  <text x="245" y="78" text-anchor="middle" font-size="11" font-weight="600" fill="#795600">Request Queue</text>
  <text x="245" y="94" text-anchor="middle" font-size="9" fill="#6A6E73">num_requests_waiting</text>
  <text x="245" y="106" text-anchor="middle" font-size="8" fill="#C9190B" font-weight="600">Saturation signal</text>

  <!-- Arrow to prefill -->
  <line x1="312" y1="85" x2="338" y2="85" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PREFILL PHASE -->
  <rect x="340" y="45" width="220" height="80" rx="6" fill="#E6FAE6" stroke="#3E8635" stroke-width="2"/>
  <text x="450" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#1E4F18">Phase 1: Prefill</text>
  <text x="450" y="82" text-anchor="middle" font-size="9" fill="#3E8635">Process ALL input tokens in parallel</text>
  <text x="450" y="96" text-anchor="middle" font-size="9" fill="#6A6E73">Allocates KV cache entries</text>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#6A6E73">Compute-intensive (high GPU util)</text>

  <!-- Arrow to decode -->
  <line x1="562" y1="85" x2="588" y2="85" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DECODE PHASE -->
  <rect x="590" y="45" width="240" height="80" rx="6" fill="#F0E6FF" stroke="#6753AC" stroke-width="2"/>
  <text x="710" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#3B1F8E">Phase 2: Decode</text>
  <text x="710" y="82" text-anchor="middle" font-size="9" fill="#6753AC">Generate ONE token at a time</text>
  <text x="710" y="96" text-anchor="middle" font-size="9" fill="#6A6E73">Reads from KV cache (memory-bound)</text>
  <text x="710" y="110" text-anchor="middle" font-size="9" fill="#6A6E73">Repeats until stop token or max_tokens</text>

  <!-- Timing metrics below phases -->
  <!-- TTFT -->
  <line x1="180" y1="140" x2="560" y2="140" stroke="#0066CC" stroke-width="2"/>
  <line x1="180" y1="135" x2="180" y2="145" stroke="#0066CC" stroke-width="2"/>
  <line x1="560" y1="135" x2="560" y2="145" stroke="#0066CC" stroke-width="2"/>
  <text x="370" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#0066CC">TTFT (Time to First Token)</text>
  <text x="370" y="167" text-anchor="middle" font-size="9" fill="#6A6E73">vllm:time_to_first_token_seconds</text>

  <!-- ITL -->
  <line x1="590" y1="140" x2="830" y2="140" stroke="#6753AC" stroke-width="2"/>
  <line x1="590" y1="135" x2="590" y2="145" stroke="#6753AC" stroke-width="2"/>
  <line x1="830" y1="135" x2="830" y2="145" stroke="#6753AC" stroke-width="2"/>
  <text x="710" y="155" text-anchor="middle" font-size="10" font-weight="600" fill="#6753AC">ITL (Inter-Token Latency)</text>
  <text x="710" y="167" text-anchor="middle" font-size="9" fill="#6A6E73">vllm:inter_token_latency_seconds</text>

  <!-- E2E -->
  <line x1="180" y1="180" x2="830" y2="180" stroke="#C9190B" stroke-width="2"/>
  <line x1="180" y1="175" x2="180" y2="185" stroke="#C9190B" stroke-width="2"/>
  <line x1="830" y1="175" x2="830" y2="185" stroke="#C9190B" stroke-width="2"/>
  <text x="505" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#C9190B">E2E Request Latency</text>
  <text x="505" y="207" text-anchor="middle" font-size="9" fill="#6A6E73">vllm:e2e_request_latency_seconds</text>

  <!-- GPU Memory Layout -->
  <text x="430" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#151515">GPU Memory Layout (NVIDIA L4 — 24 GB VRAM)</text>

  <!-- Memory bar -->
  <rect x="60" y="260" width="740" height="50" rx="4" fill="#F5F5F5" stroke="#D2D2D2" stroke-width="1"/>

  <!-- Model weights segment -->
  <rect x="62" y="262" width="480" height="46" rx="3" fill="#E7F1FA" stroke="#0066CC" stroke-width="1"/>
  <text x="302" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#002952">Model Weights (FP16) ~16 GB</text>

  <!-- CUDA overhead -->
  <rect x="544" y="262" width="75" height="46" rx="3" fill="#FCE4EC" stroke="#C9190B" stroke-width="1"/>
  <text x="581" y="283" text-anchor="middle" font-size="9" font-weight="600" fill="#A30000">CUDA</text>
  <text x="581" y="296" text-anchor="middle" font-size="9" fill="#A30000">~1.5 GB</text>

  <!-- KV Cache -->
  <rect x="621" y="262" width="177" height="46" rx="3" fill="#E6FAE6" stroke="#3E8635" stroke-width="1.5"/>
  <text x="709" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#1E4F18">KV Cache</text>
  <text x="709" y="298" text-anchor="middle" font-size="9" fill="#3E8635">~6-7 GB (variable)</text>

  <!-- KV Cache callout -->
  <line x1="709" y1="310" x2="709" y2="330" stroke="#3E8635" stroke-width="1.5"/>
  <rect x="530" y="330" width="360" height="55" rx="4" fill="#E6FAE6" stroke="#3E8635" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="710" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#1E4F18">KV Cache = key saturation bottleneck</text>
  <text x="710" y="365" text-anchor="middle" font-size="9" fill="#6A6E73">When full: new requests queue (num_requests_waiting rises)</text>
  <text x="710" y="378" text-anchor="middle" font-size="9" fill="#6A6E73">Metric: vllm:kv_cache_usage_perc (0.0 to 1.0)</text>

  <!-- Memory total marker -->
  <text x="60" y="330" font-size="9" fill="#6A6E73">0 GB</text>
  <text x="780" y="330" font-size="9" fill="#6A6E73">24 GB</text>

  <!-- Throughput metric label -->
  <rect x="60" y="340" width="200" height="45" rx="4" fill="#F5F5F5" stroke="#D2D2D2" stroke-width="1"/>
  <text x="160" y="358" text-anchor="middle" font-size="10" font-weight="600" fill="#151515">Throughput Metrics</text>
  <text x="160" y="372" text-anchor="middle" font-size="9" fill="#6A6E73">vllm:generation_tokens_total</text>
  <text x="160" y="384" text-anchor="middle" font-size="9" fill="#6A6E73">vllm:request_success_total</text>
</svg>
